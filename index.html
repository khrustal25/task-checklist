<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3FC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Чек-лист">
  <title>Чек-лист и трекер задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem("checklist-theme");
      document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
    })();
  </script>
  <style>
    :root {
      --primary: #7c5cbf;
      --primary-strong: #6341a5;
      --on-primary: #ffffff;
      --background: #f7f3fc;
      --surface: #ffffff;
      --foreground: #3b2459;
      --muted: #eee4f8;
      --border: #dcc9f0;
      --border-soft: #eadff5;
      --destructive: #dc2626;
      --destructive-soft: #fde8ef;
      --ring: #7c5cbf;
      --muted-text: #6e5a88;
      --input-bg: #fbf8fe;
      --task-bg: #fdfbff;
      --task-done-bg: #f6f0fb;
      --done-text: #8a74a8;
      --bar-fill: linear-gradient(90deg, #c4b0ea, #7c5cbf);
      --glow-1: #eadcff;
      --glow-2: #f3e8ff;
      --shadow: 0 10px 30px rgba(124, 92, 191, 0.10);
      --shadow-card: 0 4px 18px rgba(59, 36, 89, 0.06);
      --toast-bg: #3b2459;
      --toast-action: #e4d4f7;
      --ring-track: #eee4f8;
      --ring-stroke: #7c5cbf;
      --theme-btn-bg: #ffffff;
      --chip-active: #ffffff;
      --focus-glow: rgba(124, 92, 191, 0.20);
      --radius: 18px;
      --tap: 44px;
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
      --display: "Manrope", "Plus Jakarta Sans", system-ui, sans-serif;
    }

    html[data-theme="dark"] {
      --primary: #b79be8;
      --primary-strong: #cbb6f0;
      --on-primary: #2a1844;
      --background: #1a1326;
      --surface: #251b35;
      --foreground: #f0e9fa;
      --muted: #342546;
      --border: #4a3663;
      --border-soft: #3a2a50;
      --destructive: #f87171;
      --destructive-soft: #3f1d2a;
      --ring: #c4b0ea;
      --muted-text: #b9a7d0;
      --input-bg: #1f1730;
      --task-bg: #2a1f3c;
      --task-done-bg: #241933;
      --done-text: #b9a7d0;
      --bar-fill: linear-gradient(90deg, #9b7fd4, #c4b0ea);
      --glow-1: #3a2460;
      --glow-2: #2d1a48;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.22);
      --toast-bg: #3b2a52;
      --toast-action: #d8c8f2;
      --ring-track: #342546;
      --ring-stroke: #c4b0ea;
      --theme-btn-bg: #2a1f3c;
      --chip-active: #3f2f58;
      --focus-glow: rgba(196, 176, 234, 0.28);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--foreground);
      background:
        radial-gradient(1200px 500px at 10% -10%, var(--glow-1) 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, var(--glow-2) 0%, transparent 46%),
        var(--background);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background 220ms ease, color 220ms ease;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      width: min(760px, calc(100% - 24px));
      margin: 0 auto;
      padding: 20px 0 calc(96px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand-copy h1 {
      font-family: var(--display);
      font-size: clamp(1.7rem, 5vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin: 0 0 6px;
    }

    .brand-copy p {
      margin: 0;
      color: var(--muted-text);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .ring-wrap svg {
      width: 72px;
      height: 72px;
      transform: rotate(-90deg);
    }

    .ring-wrap .pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .progress-block {
      margin-bottom: 16px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .progress-meta span:last-child {
      color: var(--primary-strong);
    }

    .bar {
      height: 14px;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--bar-fill);
      transition: width 280ms ease;
    }

    .composer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .composer input {
      flex: 1 1 200px;
      width: 100%;
      min-width: 0;
      height: 48px;
      min-height: 48px;
      max-height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      font-size: 16px;
      color: var(--foreground);
      background: var(--input-bg);
      outline: none;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .composer input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 4px var(--focus-glow);
    }

    .composer button {
      flex: 0 0 auto;
      min-height: 48px;
      min-width: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 700;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 180ms ease;
    }

    .composer button:active {
      background: var(--primary-strong);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      background: var(--muted);
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .filters button {
      border: 0;
      background: transparent;
      color: var(--muted-text);
      min-height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.86rem;
    }

    .filters button[aria-pressed="true"] {
      background: var(--chip-active);
      color: var(--foreground);
      box-shadow: var(--shadow-card);
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--destructive);
      min-height: 36px;
      font-weight: 700;
      font-size: 0.86rem;
      padding: 0 8px;
    }

    .clear-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      background: var(--task-bg);
      box-shadow: var(--shadow-card);
      animation: rise 220ms ease;
    }

    .task.done {
      background: var(--task-done-bg);
    }

    .check {
      width: var(--tap);
      height: var(--tap);
      border: 0;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
    }

    .check-mark {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      display: grid;
      place-items: center;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .task.done .check-mark {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }

    .check-mark svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .task.done .check-mark svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-text {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      word-break: break-word;
    }

    .task.done .task-text {
      color: var(--done-text);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .edit-input {
      width: 100%;
      min-height: 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 10px;
      font-size: 16px;
      outline: none;
    }

    .delete-btn {
      width: var(--tap);
      height: var(--tap);
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted-text);
      display: grid;
      place-items: center;
      transition: background 180ms ease, color 180ms ease;
    }

    .delete-btn:hover,
    .delete-btn:focus-visible {
      background: var(--destructive-soft);
      color: var(--destructive);
    }

    .empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted-text);
    }

    .empty strong {
      display: block;
      font-family: var(--display);
      font-size: 1.15rem;
      color: var(--foreground);
      margin-bottom: 6px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: var(--toast-bg);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      z-index: 20;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast button {
      border: 0;
      background: transparent;
      color: var(--toast-action);
      font-weight: 700;
    }

    .theme-toggle {
      position: fixed;
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 56px;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--theme-btn-bg);
      color: var(--foreground);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      z-index: 30;
      transition: background 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    body:has(input:focus) .theme-toggle {
      opacity: 0;
      pointer-events: none;
    }

    .theme-toggle .icon-sun,
    html[data-theme="dark"] .theme-toggle .icon-moon {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .icon-sun {
      display: block;
    }

    @media (hover: hover) and (pointer: fine) {
      .composer button:hover {
        background: var(--primary-strong);
      }

      .theme-toggle:hover {
        transform: scale(1.04);
      }
    }

    :focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1024px) {
      .composer {
        flex-direction: column;
        align-items: stretch;
      }

      .composer input {
        flex: 0 0 auto;
        width: 100%;
      }

      .composer button {
        width: 100%;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .filters {
        width: 100%;
      }

      .filters button {
        flex: 1;
      }

      .clear-btn {
        align-self: flex-end;
      }
    }

    @media (min-width: 768px) {
      .app {
        padding-top: 40px;
      }

      .panel {
        padding: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="brand-copy">
        <h1>Чек-лист задач</h1>
        <p id="today"></p>
      </div>
      <div class="ring-wrap" aria-hidden="true">
        <svg viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="30" fill="none" stroke="var(--ring-track)" stroke-width="8"></circle>
          <circle id="ring" cx="36" cy="36" r="30" fill="none" stroke="var(--ring-stroke)" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.4" stroke-dashoffset="188.4"></circle>
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
    </header>

    <section class="panel" aria-labelledby="app-title">
      <h2 id="app-title" class="sr-only">Трекер задач</h2>

      <div class="progress-block">
        <div class="progress-meta">
          <span id="progressLabel">0 из 0 выполнено</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progressLabel" id="progressBar">
          <div class="bar-fill" id="progressFill"></div>
        </div>
      </div>

      <form class="composer" id="addForm">
        <label class="sr-only" for="taskInput">Новая задача</label>
        <input id="taskInput" type="text" maxlength="180" placeholder="Что нужно сделать?" autocomplete="off" inputmode="text" enterkeyhint="done" autocapitalize="sentences">
        <button type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          Добавить
        </button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Фильтр задач">
          <button type="button" data-filter="all" aria-pressed="true">Все</button>
          <button type="button" data-filter="active" aria-pressed="false">Активные</button>
          <button type="button" data-filter="done" aria-pressed="false">Готовые</button>
        </div>
        <button class="clear-btn" type="button" id="clearDone" disabled>Удалить готовые</button>
      </div>

      <ul class="list" id="taskList"></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span>Задача удалена</span>
    <button type="button" id="undoBtn">Вернуть</button>
  </div>

  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Включить тёмную тему" aria-pressed="false">
    <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15.4 3.2A8.8 8.8 0 1 0 20.8 14 7 7 0 0 1 15.4 3.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 3v1.6M12 19.4V21M4.6 12H3M21 12h-1.6M6.2 6.2l1.1 1.1M16.7 16.7l1.1 1.1M17.8 6.2l-1.1 1.1M7.3 16.7l-1.1 1.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <script>
    const STORAGE_KEY = "checklist-tracker-v1";

    function uid() {
      if (globalThis.crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
    const state = {
      tasks: loadTasks(),
      filter: "all",
      lastDeleted: null,
      toastTimer: null
    };

    const els = {
      today: document.getElementById("today"),
      ring: document.getElementById("ring"),
      ringPct: document.getElementById("ringPct"),
      progressLabel: document.getElementById("progressLabel"),
      progressPercent: document.getElementById("progressPercent"),
      progressBar: document.getElementById("progressBar"),
      progressFill: document.getElementById("progressFill"),
      addForm: document.getElementById("addForm"),
      taskInput: document.getElementById("taskInput"),
      taskList: document.getElementById("taskList"),
      clearDone: document.getElementById("clearDone"),
      toast: document.getElementById("toast"),
      undoBtn: document.getElementById("undoBtn"),
      themeToggle: document.getElementById("themeToggle"),
      themeColor: document.querySelector('meta[name="theme-color"]')
    };

    const THEME_KEY = "checklist-theme";

    function currentTheme() {
      return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      els.themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Включить светлую тему" : "Включить тёмную тему"
      );
      els.themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
      els.themeColor.setAttribute("content", theme === "dark" ? "#1A1326" : "#F7F3FC");
    }

    applyTheme(currentTheme());

    els.themeToggle.addEventListener("click", () => {
      applyTheme(currentTheme() === "dark" ? "light" : "dark");
    });

    els.today.textContent = new Date().toLocaleDateString("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return [
            { id: uid(), text: "Составить список покупок", done: false },
            { id: uid(), text: "Проверить почту", done: true },
            { id: uid(), text: "Запланировать неделю", done: false }
          ];
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
      } catch {
        /* private mode / blocked storage */
      }
    }

    function visibleTasks() {
      if (state.filter === "active") return state.tasks.filter((task) => !task.done);
      if (state.filter === "done") return state.tasks.filter((task) => task.done);
      return state.tasks;
    }

    function updateProgress() {
      const total = state.tasks.length;
      const done = state.tasks.filter((task) => task.done).length;
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);
      const circumference = 188.4;

      els.progressLabel.textContent = `${done} из ${total} выполнено`;
      els.progressPercent.textContent = `${percent}%`;
      els.progressFill.style.width = `${percent}%`;
      els.progressBar.setAttribute("aria-valuenow", String(percent));
      els.ring.style.strokeDashoffset = String(circumference - (circumference * percent) / 100);
      els.ringPct.textContent = `${percent}%`;
      els.clearDone.disabled = done === 0;
    }

    function render() {
      const tasks = visibleTasks();
      els.taskList.innerHTML = "";

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.innerHTML = state.tasks.length === 0
          ? "<strong>Список пока пуст</strong>Добавьте первую задачу в поле выше"
          : "<strong>Здесь ничего нет</strong>Попробуйте другой фильтр";
        els.taskList.appendChild(empty);
        updateProgress();
        return;
      }

      tasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = `task${task.done ? " done" : ""}`;
        item.dataset.id = task.id;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", task.done ? "Отметить как невыполненную" : "Отметить как выполненную");
        check.innerHTML = `
          <span class="check-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12.5l4.2 4.2L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        `;
        check.addEventListener("click", () => toggleTask(task.id));

        const text = document.createElement("p");
        text.className = "task-text";
        text.textContent = task.text;
        text.title = "Нажмите, чтобы изменить";
        text.addEventListener("dblclick", () => startEdit(item, task));
        text.addEventListener("click", () => startEdit(item, task));

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.type = "button";
        del.setAttribute("aria-label", `Удалить задачу: ${task.text}`);
        del.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
        del.addEventListener("click", () => deleteTask(task.id));

        item.append(check, text, del);
        els.taskList.appendChild(item);
      });

      updateProgress();
    }

    function startEdit(item, task) {
      if (item.querySelector(".edit-input")) return;
      const input = document.createElement("input");
      input.className = "edit-input";
      input.value = task.text;
      input.maxLength = 180;
      item.children[1].replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        const next = input.value.trim();
        if (next) {
          task.text = next;
          saveTasks();
        }
        render();
      };

      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          input.blur();
        }
        if (event.key === "Escape") {
          render();
        }
      });
    }

    function addTask(text) {
      state.tasks.unshift({
        id: uid(),
        text,
        done: false
      });
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;
      task.done = !task.done;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      const index = state.tasks.findIndex((item) => item.id === id);
      if (index === -1) return;
      state.lastDeleted = { task: state.tasks[index], index };
      state.tasks.splice(index, 1);
      saveTasks();
      render();
      showToast();
    }

    function showToast() {
      els.toast.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        els.toast.classList.remove("show");
        state.lastDeleted = null;
      }, 4000);
    }

    els.addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = els.taskInput.value.trim();
      if (!text) {
        els.taskInput.focus();
        return;
      }
      addTask(text);
      els.taskInput.value = "";
      els.taskInput.focus();
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });
    });

    els.clearDone.addEventListener("click", () => {
      state.tasks = state.tasks.filter((task) => !task.done);
      saveTasks();
      render();
    });

    els.undoBtn.addEventListener("click", () => {
      if (!state.lastDeleted) return;
      state.tasks.splice(state.lastDeleted.index, 0, state.lastDeleted.task);
      state.lastDeleted = null;
      els.toast.classList.remove("show");
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
